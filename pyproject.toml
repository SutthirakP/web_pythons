[project]
name = "awesome-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "keras>=3.15.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "strawberry-graphql>=0.327.7",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# hide noise from old-style code/libraries so real failures are easy to spot
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
